name: Publish v1.0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 --repo "$GITHUB_REPOSITORY" --target "56baf072843a5daf21b5c2e182672f54a9dedf7f" --title "Processo de Desenvolvimento com IA Assistida v1.0.1" --notes "v1.0.1 consolida a ativação da Engine no ChatGPT, o handoff formal para o Codex, o reforço do Documento 06, a Visão do Tech Lead, a separação entre Engenharia/Arquitetura/stack/Infraestrutura, o exemplo AVA OMEM e os refinamentos de precedência e rastreabilidade FND. Base da release: 56baf072843a5daf21b5c2e182672f54a9dedf7f"
